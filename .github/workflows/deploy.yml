# Baut die Website bei jedem Push und veröffentlicht sie auf GitHub Pages.
# Veröffentlicht wird der Standard-Branch – oder jeder Branch, wenn der Workflow manuell gestartet wird
# (Actions → "Build & Deploy" → "Run workflow").
name: Build & Deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ermittelt die Pages-URL (Unterordner bei user.github.io/repo, sonst die eigene Domain)
      # und schaltet GitHub Pages ein, falls noch nicht geschehen.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
